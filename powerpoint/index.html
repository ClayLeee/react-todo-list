                        ## 什麼是 Playwright?
                    </script>
                </section>

                <section data-markdown>
                    <script type="text/template">
                        ## Playwright

                        - 2019 年由微軟推出的網頁自動化測試框架，支援多種主流的瀏覽器，且可跨平臺執行。

                        - 你在瀏覽器能做到的任何事情，它都能自動化，可以用來做測試、爬蟲、操作網站、模擬使用者。
                    </script>
                </section>

                <section data-markdown>
                    <script type="text/template">
                        ## Playwright MCP

                        - A **Model Context Protocol (MCP)** server that provides browser automation capabilities using Playwright.

                        - 這個伺服器讓 LLM 能夠透過結構化的無障礙快照與網頁互動，無需使用截圖或視覺模型。
                    </script>
                </section>

                <section data-markdown>
                    <script type="text/template">
                        ## Playwright MCP 可用工具

                        ![Playwright MCP Functions](images/playwright-functions.jpg)
                    </script>
                </section>

                <section data-markdown>
                    <script type="text/template">
                        ## 瀏覽器控制

                        - `browser_navigate`: 導航到指定 URL
                        - `browser_close`:  關閉瀏覽器
                        - `browser_resize`: 調整瀏覽器視窗大小
                        - `browser_tabs`: 管理瀏覽器分頁
                        - `browser_navigate_back`: 返回上一頁
                    </script>
                </section>

                <section data-markdown>
                    <script type="text/template">
                        ## 頁面互動

                        - `browser_click`: 點擊頁面元素
                        - `browser_type`: 輸入文字
                        - `browser_fill_form`: 填寫表單
                        - `browser_select_option`: 選擇下拉選項
                        - `browser_hover`: 滑鼠懸停
                        - `browser_drag`: 拖放操作
                        - `browser_press_key`: 按鍵操作
                    </script>
                </section>

                <section data-markdown>
                    <script type="text/template">
                        ## 除錯與監控

                        - `browser_console_messages`: 獲取控制台訊息
                        - `browser_network_requests`: 監控網路請求
                    </script>
                </section>
            </section>

                        ## 配置流程概述

                <section data-markdown>
                    <script type="text/template">
                        ## 系統需求

                        - **Node.js 18** 或更新版本

                        - **支援的 MCP 客戶端**
                          - **Claude Code**
                          - **Codex**
                          - **Cursor**
                          - **Gemini CLI**
                          - **Goose**
                          - **VS Code**
                          - **Windsurf**
                    </script>
                </section>

                <section data-markdown>
                    <script type="text/template">
                        ### 步驟 1: 在 Client 上安裝 [Playwright MCP](https://github.com/microsoft/playwright-mcp) Server

                        ```json[|3-8]
                        {
                          "mcpServers": {
                            "playwright": {
                              "command": "npx",
                              "args": [
                                "@playwright/mcp@latest"
                              ]
                            }
                          }
                        }
                        ```
                    </script>
                </section>

                <section data-markdown>
                    <script type="text/template">
                        ### 步驟 2: 安裝依賴

                        ```bash[1-2 | 4-9]
                        # 安裝 Playwright Test Runner，生成測試檔案需要
                        $ pnpm add -D @playwright/test

                        # Playwright Test Runner 需要安裝瀏覽器引擎，執行測試需要
                        # 執行以下指令安裝單一瀏覽器引擎
                        $ pnpm exec playwright install chromium

                        # 執行以下指令安裝所有瀏覽器引擎
                        $ pnpm exec playwright install
                        ```
                    </script>
                </section>

                <section data-markdown>
                    <script type="text/template">
                        ### 步驟 3: 創建 `playwright.config.ts` 配置文件

                        ```typescript[|1 | 4-5 | 7-13 | 15-22 | 24-34]
                        import { defineConfig, devices } from '@playwright/test';

                        export default defineConfig({
                            // 測試檔案目錄
                            testDir: './tests',

                            // 測試報告輸出格式
                            reporter: [
                                ['html'],
                                ['list'],
                                ['junit', { outputFile: 'test-results/test-results.xml' }],
                                ['json', { outputFile: 'test-results/test-results.json' }],
                            ],

                            // 測試環境設定
                            use: {
                                baseURL: 'http://localhost:5173',
                                trace: 'on-first-retry',
                                screenshot: 'only-on-failure',
                                video: 'retain-on-failure',
                                viewport: { width: 1280, height: 720 },
                            },

                            // 測試瀏覽器引擎設定
                            projects: [
                                {
                                    name: 'chromium',
                                    use: { ...devices['Desktop Chrome'] },
                                },
                                {
                                    name: 'firefox',
                                    use: { ...devices['Desktop Firefox'] },
                                },
                            ],
                        });
                        ```
                    </script>
                </section>
